services:
  - type: web
    name: privexis-api
    runtime: docker
    region: singapore
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health/ready
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: privexis-db
          property: connectionString
      - key: PRIVEXIS_ENV
        value: production
      - key: PRIVEXIS_SECRET_KEY
        generateValue: true
      - key: PRIVEXIS_FRONTEND_ORIGIN
        value: https://privexis.vercel.app
      - key: PRIVEXIS_UPLOAD_DIR
        value: /app/backend/uploads
      - key: PRIVEXIS_MAX_UPLOAD_MB
        value: "15"
      - key: PRIVEXIS_SCAN_SAMPLE_ROWS
        value: "500"

databases:
  - name: privexis-db
    databaseName: privexis
    user: privexis
    region: singapore
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
