[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentry-pii"
version = "0.1.0"
description = "Deterministic, privacy-preserving PII detection core for the PS-019 hackathon project"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "hypothesis>=6.100,<7",
]
app = [
  "streamlit>=1.35",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
